name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv && uv pip install -e '.[dev,strict]'
      - run: .venv/bin/ruff check --select F ignition_gen_sdk tests
      - run: .venv/bin/pytest -q
  # Spec-dependent and fixture-diff modules skip here; run them locally against a gateway:
  #   ign openapi fetch && pytest
