[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ignition-gen-sdk"
version = "0.1.0"
description = "Agent SDK and CLI for Inductive Automation Ignition 8.3: typed Pydantic models, gateway API client, and on-disk resource writers."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "typer>=0.25",
    "httpx>=0.28",
    "python-dotenv>=1.2",
    "rich>=13",
    # The typed resource verbs (provider, db-conn, alarm-journal, driver) generate
    # a client from the gateway's OpenAPI spec on first use.
    "openapi-python-client>=0.28.4",
]

[project.urls]
Repository = "https://github.com/WRRooney/ignition-gen-sdk"

[project.optional-dependencies]
# `ign api --strict`: deep OpenAPI schema validation of body/query/path params.
strict = ["openapi-core>=0.19"]
# Kept for compatibility; codegen is a core dependency.
codegen = []
# `ign view validate`: headless Chrome render of a Perspective page.
# After install: `playwright install chrome`.
runtime = ["playwright>=1.40"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ign = "ignition_gen_sdk.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["ignition_gen_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: opt-in live-gateway tests; need IGNITION_URL + IGNITION_API_TOKEN. Run with `pytest -m smoke`.",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
